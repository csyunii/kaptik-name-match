<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Name Match | Kaptik</title>
<style>
:root{--p:#6D28D9;--p2:#8B5CF6;--pl:#F5F3FF;--pl2:#EDE9FE;--ink:#0A0A0A;--g:#737373;--g2:#E5E5E5}
*{box-sizing:border-box}
body{margin:0;background:var(--pl);font-family:Inter,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
.w{max-width:480px;margin:0 auto;padding:20px 16px 140px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-weight:900;font-style:italic;font-size:22px;letter-spacing:-.5px}
.pill{font-size:12px;font-weight:700;color:var(--p);background:#fff;border:1px solid var(--pl2);border-radius:99px;padding:6px 12px}
.eyebrow{text-align:center;color:var(--p);font-weight:800;font-size:12px;letter-spacing:2px}
h1{text-align:center;font-size:36px;line-height:1.1;margin:8px 0 6px;letter-spacing:-1px}
h1 span{background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--g);font-size:14px;line-height:1.5;margin-bottom:18px}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 30px rgba(109,40,217,.08);border:1px solid var(--pl2)}
label{display:block;font-size:12px;color:var(--g);font-weight:700;margin-bottom:6px}
input{width:100%;padding:14px;border:2px solid var(--pl2);border-radius:14px;font-size:18px;text-align:center;outline:none;font-family:inherit;transition:border .2s}
input:focus{border-color:var(--p2)}
.vs{display:flex;align-items:center;gap:10px;margin:14px 0}
.vs .box{flex:1}
.heartic{color:var(--p);font-size:22px;margin-top:18px}
.fixed{padding:14px;border-radius:14px;background:var(--pl);text-align:center;font-size:18px;font-weight:700}
.hint{font-size:12px;color:var(--g);text-align:center;margin:8px 0 14px;min-height:16px}
.hint b{color:var(--p)}
button{cursor:pointer;border:0;border-radius:99px;padding:15px;font-size:16px;font-weight:800;width:100%;background:var(--ink);color:#fff;font-family:inherit}
button:disabled{opacity:.4;cursor:default}
.names{text-align:center;font-size:20px;font-weight:800}
.names i{color:var(--p);font-style:normal;margin:0 6px}
.pct{text-align:center;font-size:64px;font-weight:900;margin:6px 0 10px;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:5px;justify-content:center;margin:4px 0}
.c{min-width:32px;height:32px;border-radius:10px;background:var(--pl2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;padding:0 4px;color:#4C1D95}
.c.b{background:#F3F4F6;color:var(--ink)}
.c.n{background:#fff;border:1.5px solid var(--pl2);animation:pop .3s}
.c.last{background:var(--p);color:#fff;border:0}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.legend{font-size:11px;color:var(--g);text-align:center;margin-top:10px}
.chat{margin-top:18px}
.m{scroll-margin-bottom:120px;display:flex;gap:8px;margin:10px 0;animation:pop .3s;align-items:flex-end}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.bub{background:#fff;border:1px solid var(--pl2);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:15px;line-height:1.45;max-width:78%}
.me{justify-content:flex-end}
.me .bub{background:var(--p);color:#fff;border:0;border-radius:18px 18px 4px 18px}
.typing .bub{color:var(--g);letter-spacing:3px}
.lock .bub{filter:blur(5px);user-select:none}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:480px;margin:0 auto;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
#dock>*{pointer-events:auto}
.reply{display:flex;gap:8px;background:#fff;padding:6px;border-radius:99px;border:1px solid var(--pl2);box-shadow:0 8px 24px rgba(109,40,217,.18)}
.reply input{border:0;text-align:left;font-size:16px;padding:10px 14px}
.reply button{width:auto;padding:0 18px;background:var(--p)}
.left{font-size:11px;color:var(--g);text-align:center;margin-top:6px;text-shadow:0 0 6px var(--pl)}
.cta{display:block;text-align:center;text-decoration:none;background:var(--ink);color:#fff;border-radius:99px;padding:16px;font-weight:800;margin-top:14px}
.cta2{display:block;text-align:center;color:var(--p);font-weight:700;font-size:13px;margin-top:10px;text-decoration:none}
.kp{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;padding:10px 14px;background:var(--pl);border-radius:14px}
.kp span{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--g)}
.kp b{font-size:22px;color:var(--p);letter-spacing:1px}
.step{font-size:12px;color:var(--g);font-weight:700;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:auto;padding:9px 14px;font-size:14px;font-weight:700;background:var(--pl);color:var(--p);border:1.5px solid var(--pl2);border-radius:99px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.klabel{text-align:center;font-size:11px;color:var(--g);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.hid{display:none!important}
.small{font-size:12px;color:var(--g);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="w">
  <div class="top"><div class="logo">Kaptik</div><div class="pill">Name Match</div></div>

  <div id="intro">
    <div class="eyebrow">CHECK YOUR NAME MATCH</div>
    <h1>You <span>&amp;</span> your bias</h1>
    <div class="sub">Type your name, pick your group and your bias.<br>We turn your name into Korean and run the classic 이름궁합 test.</div>
    <div class="card">
      <label>1. YOUR NAME</label>
      <input id="en" placeholder="e.g. Amy" autocomplete="off" maxlength="24">
      <div class="kp hid" id="kp"><span>IN KOREAN</span><b id="kpv"></b></div>
      <div class="step">2. PICK A GROUP</div>
      <div class="chips" id="groups"></div>
      <div id="memberWrap" class="hid">
        <div class="step">3. PICK YOUR BIAS</div>
        <div class="chips" id="members"></div>
      </div>
      <div class="hint" id="hint"></div>
      <button id="go" disabled>Check our match</button>
    </div>
  </div>

  <div class="card hid" id="r">
    <div class="klabel">Your name in Korean</div>
    <div class="names"><span id="a"></span><i>♥</i><span id="b"></span></div>
    <div class="pct" id="pc">??%</div>
    <div id="tb"></div>
  </div>

  <div class="chat hid" id="chat"></div>
  <div id="dock"><div class="reply hid" id="rp"><input id="txt" placeholder="Reply..." autocomplete="off" maxlength="200"><button id="snd">Send</button></div><div class="left hid" id="left"></div></div>
  <div id="end"></div>
</div>

/* ---------- 3) Generic Revised-Romanization syllables (fallback) ---------- */
const GEN = {};
(()=>{
  const ON=[['','ㅇ'],['g','ㄱ'],['k','ㅋ'],['kk','ㄲ'],['n','ㄴ'],['d','ㄷ'],['t','ㅌ'],['tt','ㄸ'],['r','ㄹ'],['l','ㄹ'],['m','ㅁ'],['b','ㅂ'],['p','ㅍ'],['pp','ㅃ'],['s','ㅅ'],['ss','ㅆ'],['sh','ㅅ'],['j','ㅈ'],['jj','ㅉ'],['ch','ㅊ'],['h','ㅎ']];
  const V=[['a','ㅏ'],['ae','ㅐ'],['ya','ㅑ'],['yae','ㅒ'],['eo','ㅓ'],['e','ㅔ'],['yeo','ㅕ'],['ye','ㅖ'],['o','ㅗ'],['wa','ㅘ'],['wae','ㅙ'],['oe','ㅚ'],['yo','ㅛ'],['u','ㅜ'],['oo','ㅜ'],['wo','ㅝ'],['we','ㅞ'],['wi','ㅟ'],['yu','ㅠ'],['eu','ㅡ'],['ui','ㅢ'],['i','ㅣ'],['ee','ㅣ']];
  const CO=[['',''],['k','ㄱ'],['g','ㄱ'],['n','ㄴ'],['l','ㄹ'],['m','ㅁ'],['p','ㅂ'],['b','ㅂ'],['ng','ㅇ']];
  for(const[o,O]of ON)for(const[v,Vv]of V)for(const[c,C]of CO){const k=o+v+c;if(!(k in GEN))GEN[k]=comp(O,Vv,C);}
})();

/* Segment a romanized Korean name into syllables (dynamic programming, lowest cost wins) */
function koreanSegment(s){
  const n=s.length,best=Array(n+1).fill(Infinity),prev=Array(n+1).fill(null);best[0]=0;
  for(let i=0;i<n;i++){if(best[i]===Infinity)continue;
    for(let j=i+1;j<=Math.min(n,i+7);j++){const piece=s.slice(i,j);let cost,out;
      if(piece in KO_SYL){cost=1;out=KO_SYL[piece]}else if(piece in GEN){cost=1.7;out=GEN[piece]}else continue;
      if(i>0&&/^[aeiou]/.test(piece))cost+=0.6;
      if(i>0&&s[i-1]==='n'&&piece[0]==='g')cost+=0.3; // prefer 'jung+won' over 'jun+gwon'      // syllables rarely start with a bare vowel mid-name
      if(best[i]+cost<best[j]){best[j]=best[i]+cost;prev[j]=[i,out,cost]}}}
  if(best[n]===Infinity)return null;
  let out=[],k=n,gen=0;while(k>0){const[i,o,c]=prev[k];out.unshift(o);if(c>=1.7)gen++;k=i}
  return {text:out.join(''),score:best[n]/out.length,gen,count:out.length};
}

/* Phonetic fallback for non-Korean names not in the list */
function phonetic(s){
  s=s.replace(/c(?=[eiy])/g,'s').replace(/i([^aeiouy])e$/,'a.i$1').replace(/a([^aeiouy])e$/,'e.i$1').replace(/(?<=[aeiou].*[^aeiouy])e$/,'').replace(/c(?=[eiy])/g,'s').replace(/^x/,'s').replace(/er$/,'q').replace(/ph/g,'f').replace(/ck/g,'k').replace(/(?<=[aeiou])r(?![aeiouy])/g,'').replace(/(?<=[aeiouy])h(?![aeiouy])/g,'').replace(/(?<=[aeiouy])l(?=[aeiouy])/g,'ll');
  const VT=[['q','ㅓ'],['wi','ㅟ'],['wa','ㅘ'],['we','ㅞ'],['wo','ㅝ'],['ee','ㅣ'],['ea','ㅣ'],['oo','ㅜ'],['ou','ㅜ'],['ai','ㅔ'],['ay','ㅔ'],['ey','ㅔ'],['ie','ㅣ'],['a','ㅏ'],['e','ㅔ'],['i','ㅣ'],['o','ㅗ'],['u','ㅜ'],['y','ㅣ']];
  const CT=[['ng','ㅇ'],['ch','ㅊ'],['sh','ㅅ'],['th','ㅅ'],['b','ㅂ'],['c','ㅋ'],['d','ㄷ'],['f','ㅍ'],['g','ㄱ'],['h','ㅎ'],['j','ㅈ'],['k','ㅋ'],['l','ㄹ'],['m','ㅁ'],['n','ㄴ'],['p','ㅍ'],['r','ㄹ'],['s','ㅅ'],['t','ㅌ'],['v','ㅂ'],['w','ㅇ'],['x','ㅋ'],['z','ㅈ']];
  let t=[],i=0;
  while(i<s.length){let m=null;
    for(const[k,v]of VT)if(s.startsWith(k,i)){m=['v',v,k.length];break}
    if(!m)for(const[k,v]of CT)if(s.startsWith(k,i)){m=['c',v,k.length];break}
    if(!m){i++;continue}
    if(m[0]==='c'&&t.length&&t[t.length-1][0]==='c'&&t[t.length-1][1]===m[1]&&m[1]!=='ㄹ'){i+=m[2];continue}
    t.push([m[0],m[1]]);i+=m[2]}
  const CODA=['ㄴ','ㄹ','ㅁ','ㅇ'];let out='',k=0;
  while(k<t.length){let o='ㅇ',v;
    if(t[k][0]==='c'){if(k+1<t.length&&t[k+1][0]==='v'){o=t[k][1];v=t[k+1][1];k+=2}else{out+=comp(t[k][1],'ㅡ');k++;continue}}
    else{v=t[k][1];k++}
    let c='';if(k<t.length&&t[k][0]==='c'&&!(k+1<t.length&&t[k+1][0]==='v')&&CODA.includes(t[k][1])){c=t[k][1];k++}
    out+=comp(o,v,c)}
  return out;
}

function toHangul(raw){
  if(/^ros[ée]$/i.test(raw.trim())&&/é/i.test(raw))return {text:'로제',how:'en'};
  const s=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'');
  if(!s)return {text:'',how:''};
  if(EN_NAMES[s])return {text:EN_NAMES[s],how:'en'};
  const k=koreanSegment(s);
  if(k&&k.gen===0)return {text:k.text,how:'ko'};
  if(k&&k.gen<=1&&k.count>=3)return {text:k.text,how:'ko'};
  return {text:phonetic(s),how:'ph'};
}

/* ---------- Compatibility math (same as the classic 이름궁합) ---------- */
const ST={'ㄱ':2,'ㄲ':4,'ㄴ':2,'ㄷ':3,'ㄸ':6,'ㄹ':5,'ㅁ':4,'ㅂ':4,'ㅃ':8,'ㅅ':2,'ㅆ':4,'ㅇ':1,'ㅈ':3,'ㅉ':6,'ㅊ':4,'ㅋ':3,'ㅌ':4,'ㅍ':4,'ㅎ':3,
'ㅏ':2,'ㅐ':3,'ㅑ':3,'ㅒ':4,'ㅓ':2,'ㅔ':3,'ㅕ':3,'ㅖ':4,'ㅗ':2,'ㅘ':4,'ㅙ':5,'ㅚ':3,'ㅛ':3,'ㅜ':2,'ㅝ':4,'ㅞ':5,'ㅟ':3,'ㅠ':3,'ㅡ':1,'ㅢ':2,'ㅣ':1,
'ㄳ':4,'ㄵ':5,'ㄶ':5,'ㄺ':7,'ㄻ':9,'ㄼ':9,'ㄽ':7,'ㄾ':9,'ㄿ':9,'ㅀ':8,'ㅄ':6};
const SPLIT={'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
const DV={'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};
function jamo(name){const r=[];for(const ch of name){const n=ch.charCodeAt(0)-0xAC00;if(n<0||n>11171)continue;
  const o=CH[Math.floor(n/588)],v=VO[Math.floor(n%588/28)],c=JO[n%28];
  r.push(o);for(const x of(DV[v]||v))r.push(x);if(c)for(const x of(SPLIT[c]||c))r.push(x)}return r}
function calc(a,b){const A=jamo(a),B=jamo(b),L=Math.max(A.length,B.length);
  let row=[];for(let i=0;i<L;i++)row.push(((A[i]?ST[A[i]]:0)+(B[i]?ST[B[i]]:0))%10);
  const rows=[row];while(row.length>2){const n=[];for(let i=0;i<row.length-1;i++)n.push((row[i]+row[i+1])%10);rows.push(n);row=n}
  let pct=row.length===2?row[0]*10+row[1]:row[0]*10;if(pct===0)pct=100; // 00 reads as a perfect 100
  return {A,B,L,rows,pct}}

/* ---------- UI ---------- */
const GROUPS={
 'BTS':[['RM','알엠'],['Jin','진'],['SUGA','슈가'],['j-hope','제이홉'],['Jimin','지민'],['V','뷔'],['Jungkook','정국']],
 'Stray Kids':[['Bang Chan','방찬'],['Lee Know','리노'],['Changbin','창빈'],['Hyunjin','현진'],['Han','한'],['Felix','필릭스'],['Seungmin','승민'],['I.N','아이엔']],
 'ENHYPEN':[['Jungwon','정원'],['Heeseung','희승'],['Jay','제이'],['Jake','제이크'],['Sunghoon','성훈'],['Sunoo','선우'],['Ni-ki','니키']],
 'SEVENTEEN':[['S.Coups','에스쿱스'],['Jeonghan','정한'],['Joshua','조슈아'],['Jun','준'],['Hoshi','호시'],['Wonwoo','원우'],['Woozi','우지'],['The 8','디에잇'],['Mingyu','민규'],['DK','도겸'],['Seungkwan','승관'],['Vernon','버논'],['Dino','디노']],

const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let selGroup=null,selMember=null;

function chip(label,on,fn){const b=document.createElement('button');b.type='button';b.className='chip'+(on?' on':'');b.textContent=label;b.onclick=fn;return b}
function renderGroups(){const g=$('groups');g.innerHTML='';
  Object.keys(GROUPS).forEach(k=>g.appendChild(chip(k,selGroup===k,()=>{selGroup=k;selMember=null;renderGroups();renderMembers();check()})))}
function renderMembers(){const m=$('members');m.innerHTML='';$('memberWrap').classList.toggle('hid',!selGroup);if(!selGroup)return;
  GROUPS[selGroup].forEach(([en,ko])=>m.appendChild(chip(en,selMember&&selMember.en===en,()=>{selMember={en,ko,group:selGroup};renderMembers();check()})))}
function validName(){return /[a-z]/i.test($('en').value)}
function check(){$('go').disabled=!(validName()&&selGroup&&selMember);
  $('hint').textContent=!validName()?'Type your name first.':!selGroup?'Pick a group.':!selMember?'Pick your bias.':''}
$('en').addEventListener('input',()=>{const t=toHangul($('en').value).text;$('kpv').textContent=t;$('kp').classList.toggle('hid',!t);check()});
renderGroups();check();

const initials=n=>n.replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
function bubble(who,html,cls=''){const d=document.createElement('div');d.className='m '+(who==='me'?'me ':'')+cls;
  d.innerHTML=(who==='me'?'':'<div class="av">'+initials(selMember.en)+'</div>')+'<div class="bub">'+html+'</div>';$('chat').appendChild(d);
  d.scrollIntoView({behavior:'smooth',block:'end'});return d}
async function say(text,cls=''){const t=bubble('c','•••','typing');await wait(700+Math.min(text.length*18,1400));t.remove();bubble('c',text,cls)}

function verdict(p){
  if(p>=90)return p+"%? Okay... that's basically fate. I'm not even going to pretend I'm calm right now.";
  if(p>=70)return "We're "+p+"%? Not bad. Actually, kind of really good?";
  if(p>=50)return p+"%, huh. Halfway there. Honestly that just makes me want to know you more.";
  if(p>=30)return p+"%... don't look at me like that. I like a challenge.";
  return "Only "+p+"%? Good. Easy things are boring anyway."}

function intent(t){t=t.toLowerCase();
  if(/(fate|destiny|soulmate|meant to be|omg|perfect)/.test(t))return 'love';
  if(/\b(love|luv|ily|marry|husband|bf|boyfriend|crush)\b|❤|♥|💜/.test(t))return 'love';
  if(/\b(no|nah|nope|low|bad|sad|ugh|lame)\b/.test(t))return 'no';
  if(/\b(yes|yeah|yep|ya|ok|okay|sure|of course|obviously|duh)\b/.test(t))return 'yes';
  if(/(haha|lol|lmao|hehe|😂|🤣)/.test(t))return 'laugh';
  if(/\?/.test(t))return 'q';
  return 'other'}

const SCRIPT=[
  {love:"Wow. Straight to the point, huh? I didn't expect my heart to react like that.",
   no:"Hey, don't be like that. Numbers can't measure everything... right?",
   yes:"See? I knew you'd say that. You're easy to read, you know.",
   laugh:"Are you laughing at me? That's cute. Do it again.",
   q:"Good question. I'll tell you, but only if you answer mine first.",
   other:"Hm. I like the way you talk.",
   next:n=>"So tell me, "+n+". If we met right now, what's the first thing you'd say to me?"},
  {love:"Okay, you can't just say things like that. Now I'm the one getting flustered.",
   no:"Playing hard to get? That's... honestly working on me.",
   yes:"Ha. You're braver than I thought.",
   laugh:"Your laugh is going to stay in my head all night.",
   q:"You keep asking me things. What if I just showed you instead?",
   other:"I'd pretend I wasn't nervous. You'd see right through it, though.",
   next:()=>"Can I be honest with you? There's something I've been holding back since I saw our number."},
  {love:"Then come closer. I don't want anyone else hearing this part.",
   no:"Liar. You wouldn't still be here if you didn't want to hear it.",
   yes:"Okay. Come a little closer then.",
   laugh:"Stop smiling like that, it's making this harder to say.",
   q:"I'll answer everything. Just let me say this first.",
   other:"Then I'll say it. But only to you.",
   next:()=>""}
];

let turn=0,busy=false,fan='';
$('go').addEventListener('click',async()=>{
  if(busy||$('go').disabled)return;
  const raw=$('en').value.trim();const ko=toHangul(raw).text;
  if(!/^[가-힣]{1,6}$/.test(ko)){$('hint').textContent='Please use letters A-Z in your name.';return}
  busy=true;fan=raw.charAt(0).toUpperCase()+raw.slice(1);
  const R=calc(ko,selMember.ko);
  $('intro').classList.add('hid');$('r').classList.remove('hid');$('chat').classList.remove('hid');
  $('a').textContent=ko;$('b').textContent=selMember.ko;const tb=$('tb');tb.innerHTML='';
  window.scrollTo({top:0});
  const mk=(arr,cls='')=>{const d=document.createElement('div');d.className='row';arr.forEach(x=>{const e=document.createElement('div');e.className='c '+cls;e.textContent=x;d.appendChild(e)});tb.appendChild(d);return d};
  await wait(600);
  mk(R.A.concat(Array(R.L-R.A.length).fill('')));mk(R.B.concat(Array(R.L-R.B.length).fill('')),'b');
  await wait(500);
  for(let i=0;i<R.rows.length;i++){mk(R.rows[i],i===R.rows.length-1?'n last':'n');await wait(500)}
  for(let i=0;i<=R.pct;i+=Math.max(1,Math.ceil(R.pct/25))){$('pc').textContent=i+'%';await wait(30)}
  $('pc').textContent=R.pct+'%';
  await wait(400);
  await say("Hey "+esc(fan)+", it's "+esc(selMember.en)+". I just ran the numbers on us.");
  await say(verdict(R.pct));
  await say("So... what do you think about our number?");
  $('rp').classList.remove('hid');$('left').classList.remove('hid');updateLeft();$('txt').focus();busy=false;
});
function updateLeft(){const n=3-turn;$('left').textContent=n>0?n+' '+(n===1?'reply':'replies')+' left in this preview':''}

async function send(){
  const v=$('txt').value.trim();if(!v||busy||turn>=3)return;busy=true;
  bubble('me',esc(v));$('txt').value='';$('snd').disabled=true;
  const step=SCRIPT[turn];turn++;updateLeft();
  await say(step[intent(v)]);
  if(turn<3){await say(step.next(esc(fan)));$('snd').disabled=false;busy=false;$('txt').focus();return}
  $('rp').classList.add('hid');$('left').classList.add('hid');
  await say("Honestly? Since the moment I saw your name next to mine, I can't stop thinking about what it'd feel like to-",'lock');
  await say("...not here. The rest is just for you, on Kaptik. I'll be waiting.");
  $('end').innerHTML='<a class="cta" href="'+KAPTIK_URL+'" target="_blank" rel="noopener">Continue the chat with '+esc(selMember.en)+' on Kaptik</a><div class="small">The rest of this conversation only unlocks inside Kaptik.</div><a class="cta2" href="#" onclick="location.reload();return false;">Try another name</a>';
  $('end').scrollIntoView({behavior:'smooth',block:'end'});
}
$('snd').addEventListener('click',send);
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)send()});
if(window.visualViewport){const vv=window.visualViewport,dk=document.getElementById('dock');const fit=()=>{dk.style.bottom=Math.max(0,window.innerHeight-vv.height-vv.offsetTop)+'px'};vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);fit()}
